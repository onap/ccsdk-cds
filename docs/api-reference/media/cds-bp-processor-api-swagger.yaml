openapi: 3.1.0
info:
  contact:
    email: onap-discuss@lists.onap.org
    name: ONAP Community
    url: https://www.onap.org/
  description: "Shows all resources and endpoints which CDS BP processor currently\
    \ provides with sample requests/responses, parameter description and other information."
  license:
    name: Apache 2.0
    url: http://www.apache.org/licenses/LICENSE-2.0.html
  termsOfService: https://www.onap.org/
  title: CDS Blueprint Processor API Reference
  version: 1.11.0-SNAPSHOT
servers:
- description: Generated server url
  url: ""
security:
- basicAuth: []
tags:
- description: Interaction with CBA which are available in CDS
  name: Execution Service Catalog
- description: Manages data types in CDS
  name: Model Type Catalog
- description: Interaction with stored configurations
  name: Resource configuration
- description: Interaction with resolved templates
  name: Resource Template
- description: Interaction with stored dictionaries
  name: Resource Dictionary
- description: Interaction with resolved resources
  name: Resources
- description: Manages all blueprint models which are available in CDS
  name: Blueprint Model Catalog
paths:
  /api/v1/blueprint-model:
    get:
      description: Lists all meta-data of blueprint models which are saved in CDS.
      operationId: BlueprintModelController_allBlueprintModel_GET.org.onap.ccsdk.cds.blueprintsprocessor.designer.api
      responses:
        "200":
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/BlueprintModelSearch"
          description: OK
        "500":
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/BlueprintModelSearch"
          description: Internal Server Error
      summary: List all Blueprint Models
      tags:
      - Blueprint Model Catalog
    post:
      description: Saves a blueprint model by the given CBA zip file input. There
        is no validation of the attached CBA happening when this API is called.
      operationId: BlueprintModelController_saveBlueprint_POST.org.onap.ccsdk.cds.blueprintsprocessor.designer.api
      requestBody:
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                file:
                  type: string
                  format: binary
                  description: "CBA file to be uploaded (example: cba.zip)"
              required:
              - file
      responses:
        "200":
          content:
            application/json:
              schema:
                type: object
                properties:
                  blueprintModel:
                    $ref: "#/components/schemas/BlueprintModelSearch"
          description: OK
        "500":
          content:
            application/json:
              schema:
                type: object
                properties:
                  blueprintModel:
                    $ref: "#/components/schemas/BlueprintModelSearch"
          description: Internal Server Error
      summary: Save a Blueprint Model
      tags:
      - Blueprint Model Catalog
  /api/v1/blueprint-model/bootstrap:
    post:
      description: "Loads all Model Types, Resource Dictionaries and Blueprint Models\
        \ which are included in CDS by default. Before starting to work with CDS,\
        \ bootstrap should be called to load all the basic models that each orginization\
        \ might support. Parameter values can be set as `false`  to skip loading e.g.\
        \ the Resource Dictionaries but this is not recommended."
      operationId: BlueprintModelController_bootstrap_POST.org.onap.ccsdk.cds.blueprintsprocessor.designer.api
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/BootstrapRequest"
        description: Specifies which elements to load
        required: true
      responses:
        "200":
          content: {}
          description: OK
        "500":
          content: {}
          description: Internal Server Error
      summary: Bootstrap CDS
      tags:
      - Blueprint Model Catalog
  /api/v1/blueprint-model/by-name/{name}/version/{version}:
    get:
      description: Get Meta-Data of a Blueprint Model by its name and version.
      operationId: BlueprintModelController_getBlueprintByNameAndVersion_GET.org.onap.ccsdk.cds.blueprintsprocessor.designer.api
      parameters:
      - description: Name of the blueprint model
        example: pnf_netconf
        in: path
        name: name
        required: true
        schema:
          type: string
      - description: Version of the blueprint model
        example: 1.0.0
        in: path
        name: version
        required: true
        schema:
          type: string
      responses:
        "200":
          content:
            application/json:
              schema:
                type: object
                properties:
                  blueprintModel:
                    $ref: "#/components/schemas/BlueprintModelSearch"
          description: OK
        "404":
          content:
            application/json:
              schema:
                type: object
                properties:
                  blueprintModel:
                    $ref: "#/components/schemas/BlueprintModelSearch"
          description: Not Found
      summary: Get a Blueprint Model by Name and Version
      tags:
      - Blueprint Model Catalog
  /api/v1/blueprint-model/download/by-name/{name}/version/{version}:
    get:
      description: Gets the CBA of a blueprint model by its name and version. Response
        can be saved to a file to download the CBA.
      operationId: BlueprintModelController_downloadBlueprintByNameAndVersion_GET.org.onap.ccsdk.cds.blueprintsprocessor.designer.api
      parameters:
      - description: Name of the blueprint model
        example: pnf_netconf
        in: path
        name: name
        required: true
        schema:
          type: string
      - description: Version of the blueprint model
        example: 1.0.0
        in: path
        name: version
        required: true
        schema:
          type: string
      responses:
        "200":
          content:
            application/json:
              schema:
                type: string
                format: binary
          description: OK
        "404":
          content:
            application/json:
              schema:
                type: string
                format: binary
          description: Not Found
      summary: Download a Blueprint Model
      tags:
      - Blueprint Model Catalog
  /api/v1/blueprint-model/download/{id}:
    get:
      description: Gets the CBA of a blueprint model by its ID. Response can be saved
        to a file to download the CBA.
      operationId: BlueprintModelController_downloadBluePrint_GET.org.onap.ccsdk.cds.blueprintsprocessor.designer.api
      parameters:
      - description: ID of the blueprint model to download
        example: 67ec1f96-ab55-4b81-aff9-23ee0ed1d7a4
        in: path
        name: id
        required: true
        schema:
          type: string
      responses:
        "200":
          content:
            application/json:
              schema:
                type: string
                format: binary
          description: OK
        "404":
          content:
            application/json:
              schema:
                type: string
                format: binary
          description: Not Found
      summary: Download a Blueprint Model by ID
      tags:
      - Blueprint Model Catalog
  /api/v1/blueprint-model/enrich:
    post:
      description: Enriches the attached CBA and returns the enriched CBA zip file
        in the response. The enrichment process will complete the package by providing
        all the definition of types used.
      operationId: BlueprintModelController_enrichBlueprint_POST.org.onap.ccsdk.cds.blueprintsprocessor.designer.api
      requestBody:
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                file:
                  type: string
                  format: binary
                  description: "CBA zip file to be uploaded (example: cba_unenriched.zip)"
              required:
              - file
      responses:
        "200":
          content:
            application/json:
              schema:
                type: string
                format: binary
          description: OK
      summary: Enrich a Blueprint Model
      tags:
      - Blueprint Model Catalog
  /api/v1/blueprint-model/enrichandpublish:
    post:
      description: "Enriches the attached CBA, validates it and saves it in CDS if\
        \ validation was successful."
      operationId: BlueprintModelController_enrichAndPubishlueprint_POST.org.onap.ccsdk.cds.blueprintsprocessor.designer.api
      requestBody:
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                file:
                  type: string
                  format: binary
                  description: "Unenriched CBA zip file to be uploaded (example: cba_unenriched.zip)"
              required:
              - file
      responses:
        "200":
          content:
            application/json:
              schema:
                type: object
                properties:
                  blueprintModel:
                    $ref: "#/components/schemas/BlueprintModelSearch"
          description: OK
        "503":
          content:
            application/json:
              schema:
                type: object
                properties:
                  blueprintModel:
                    $ref: "#/components/schemas/BlueprintModelSearch"
          description: Service Unavailable
      summary: Enrich and publish a Blueprint Model
      tags:
      - Blueprint Model Catalog
  /api/v1/blueprint-model/meta-data/{keyword}:
    get:
      description: "Lists all blueprint models by a matching keyword in any of the\
        \ meta-data of the blueprint models. Blueprint models are just returned if\
        \ a whole keyword is matching, not just parts of it. Not case-sensitive. Used\
        \ by CDS UI."
      operationId: BlueprintModelController_allBlueprintModelMetaData_GET.org.onap.ccsdk.cds.blueprintsprocessor.designer.api
      parameters:
      - description: Keyword to search for in blueprint model meta-data
        example: pnf_netconf
        in: path
        name: keyword
        required: true
        schema:
          type: string
      responses:
        "200":
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/BlueprintModelSearch"
          description: OK
      summary: Search for Blueprints by a Keyword
      tags:
      - Blueprint Model Catalog
  /api/v1/blueprint-model/name/{name}/version/{version}:
    delete:
      description: Deletes a blueprint model identified by its name and version from
        CDS.
      operationId: BlueprintModelController_deleteBlueprintByName_DELETE.org.onap.ccsdk.cds.blueprintsprocessor.designer.api
      parameters:
      - description: Name of the blueprint model
        example: pnf_netconf
        in: path
        name: name
        required: true
        schema:
          type: string
      - description: Version of the blueprint model
        example: 1.0.0
        in: path
        name: version
        required: true
        schema:
          type: string
      responses:
        "200":
          content: {}
          description: OK
      summary: Delete a Blueprint Model by Name
      tags:
      - Blueprint Model Catalog
  /api/v1/blueprint-model/paged:
    get:
      description: Lists all blueprint models which are saved in CDS in an ordered
        mode.
      operationId: BlueprintModelController_allBlueprintModelPaged_GET.org.onap.ccsdk.cds.blueprintsprocessor.designer.api
      parameters:
      - description: Maximum number of returned blueprint models
        in: query
        name: limit
        required: false
        schema:
          type: integer
          format: int32
          default: 20
      - description: Offset
        in: query
        name: offset
        required: false
        schema:
          type: integer
          format: int32
          default: 0
      - description: Order of returned blueprint models
        in: query
        name: sort
        required: false
        schema:
          type: string
          default: DATE
          enum:
          - DATE
          - NAME
          - VERSION
      - description: Ascend or descend ordering
        in: query
        name: sortType
        required: false
        schema:
          type: string
          default: ASC
      - description: Filter by published status (true or false)
        in: query
        name: published
        required: false
        schema:
          type: boolean
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PageBlueprintModelSearch"
          description: OK
      summary: Get Blueprints ordered
      tags:
      - Blueprint Model Catalog
  /api/v1/blueprint-model/paged/meta-data/{keyword}:
    get:
      description: "Lists all blueprint models by a matching keyword in any of the\
        \ meta-data of the blueprint models in an ordered mode. Blueprint models are\
        \ just returned if a whole keyword is matching, not just parts of it. Not\
        \ case-sensitive. Used by CDS UI."
      operationId: BlueprintModelController_allBlueprintModelMetaDataPaged_GET.org.onap.ccsdk.cds.blueprintsprocessor.designer.api
      parameters:
      - description: Keyword to search for in blueprint model meta-data
        example: pnf_netconf
        in: path
        name: keyword
        required: true
        schema:
          type: string
      - description: Maximum number of returned blueprint models
        in: query
        name: limit
        required: false
        schema:
          type: integer
          format: int32
          default: 20
      - description: Offset
        in: query
        name: offset
        required: false
        schema:
          type: integer
          format: int32
          default: 0
      - description: Order of returned blueprint models
        in: query
        name: sort
        required: false
        schema:
          type: string
          default: DATE
          enum:
          - DATE
          - NAME
          - VERSION
      - description: Ascend or descend ordering
        in: query
        name: sortType
        required: false
        schema:
          type: string
          default: ASC
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PageBlueprintModelSearch"
          description: OK
      summary: Search for Blueprints by a Keyword in an ordered mode
      tags:
      - Blueprint Model Catalog
  /api/v1/blueprint-model/publish:
    post:
      description: Validates the attached CBA file and saves it in CDS if validation
        was successful. CBA needs to be already enriched.
      operationId: BlueprintModelController_publishBlueprint_POST.org.onap.ccsdk.cds.blueprintsprocessor.designer.api
      requestBody:
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                file:
                  type: string
                  format: binary
                  description: "Enriched CBA zip file to be uploaded (example: cba_enriched.zip)"
              required:
              - file
      responses:
        "200":
          content:
            application/json:
              schema:
                type: object
                properties:
                  blueprintModel:
                    $ref: "#/components/schemas/BlueprintModelSearch"
          description: OK
      summary: Publish a Blueprint Model
      tags:
      - Blueprint Model Catalog
  /api/v1/blueprint-model/search/{tags}:
    get:
      description: Searches for all blueprint models which contain the specified input
        parameter in their tags. Blueprint models which contain just parts of the
        searched word in their tags are also returned.
      operationId: BlueprintModelController_searchBlueprintModels_GET.org.onap.ccsdk.cds.blueprintsprocessor.designer.api
      parameters:
      - description: Tag to search for
        example: test
        in: path
        name: tags
        required: true
        schema:
          type: string
      responses:
        "200":
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/BlueprintModelSearch"
          description: OK
      summary: Search for a Blueprint by Tag
      tags:
      - Blueprint Model Catalog
  /api/v1/blueprint-model/workflow-spec:
    post:
      description: "Get the workflow of a blueprint identified by Blueprint and workflow\
        \ name. Inputs, outputs and data types of workflow is returned."
      operationId: BlueprintModelController_workflowSpec_POST.org.onap.ccsdk.cds.blueprintsprocessor.designer.api
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/WorkFlowSpecRequest"
        description: Blueprint and workflow identification
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                type: string
          description: OK
      summary: Get Workflow Specification
      tags:
      - Blueprint Model Catalog
  /api/v1/blueprint-model/workflows/blueprint-name/{name}/version/{version}:
    get:
      description: Get all available workflows of a Blueprint identified by its name
        and version.
      operationId: BlueprintModelController_getWorkflowList_GET.org.onap.ccsdk.cds.blueprintsprocessor.designer.api
      parameters:
      - description: Name of the blueprint model
        example: pnf_netconf
        in: path
        name: name
        required: true
        schema:
          type: string
      - description: Version of the blueprint model
        example: 1.0.0
        in: path
        name: version
        required: true
        schema:
          type: string
      responses:
        "200":
          content:
            application/json:
              schema:
                type: string
          description: OK
      summary: Get Workflows of a Blueprint
      tags:
      - Blueprint Model Catalog
  /api/v1/blueprint-model/{id}:
    delete:
      description: "Delete a blueprint model by its ID. ID is the internally created\
        \ ID of blueprint, not the name of blueprint."
      operationId: BlueprintModelController_deleteBlueprint_DELETE.org.onap.ccsdk.cds.blueprintsprocessor.designer.api
      parameters:
      - description: ID of the blueprint model to delete
        example: 67ec1f96-ab55-4b81-aff9-23ee0ed1d7a4
        in: path
        name: id
        required: true
        schema:
          type: string
      responses:
        "200":
          content: {}
          description: OK
        "404":
          content: {}
          description: RESOURCE_NOT_FOUND
      summary: Delete a Blueprint Model by ID
      tags:
      - Blueprint Model Catalog
    get:
      description: Get meta-data of a blueprint model by its internally created ID.
      operationId: BlueprintModelController_getBlueprintModel_GET.org.onap.ccsdk.cds.blueprintsprocessor.designer.api
      parameters:
      - description: ID of the blueprint model to search for
        example: 67ec1f96-ab55-4b81-aff9-23ee0ed1d7a4
        in: path
        name: id
        required: true
        schema:
          type: string
      responses:
        "200":
          content:
            application/json:
              schema:
                type: object
                properties:
                  blueprintModel:
                    $ref: "#/components/schemas/BlueprintModelSearch"
          description: OK
        "404":
          content:
            application/json:
              schema:
                type: object
                properties:
                  blueprintModel:
                    $ref: "#/components/schemas/BlueprintModelSearch"
          description: Not Found
      summary: Get a Blueprint Model by ID
      tags:
      - Blueprint Model Catalog
  /api/v1/configs:
    get:
      description: "Retrieve a config snapshot, identified by its Resource Id and\
        \ Type. An extra 'format' parameter can be passed to tell what content-type\
        \ is expected."
      operationId: ResourceConfigSnapshotController_get_GET.org.onap.ccsdk.cds.blueprintsprocessor.configs.api
      parameters:
      - description: Resource Type associated of the resource configuration snapshot
        example: PNF
        in: query
        name: resourceType
        required: true
        schema:
          type: string
      - description: Resource Id associated of the resource configuration snapshot
        example: 1
        in: query
        name: resourceId
        required: true
        schema:
          type: string
      - description: Status of the snapshot being retrieved
        in: query
        name: status
        required: false
        schema:
          type: string
          default: RUNNING
      - description: Expected format of the snapshot being retrieved
        in: query
        name: format
        required: false
        schema:
          type: string
          default: text/plain
      responses:
        "200":
          content:
            application/json:
              schema:
                type: string
            application/xml:
              schema:
                type: string
            text/plain:
              schema:
                type: string
          description: OK
      summary: Retrieve a resource configuration snapshot
      tags:
      - Resource configuration
  /api/v1/configs/allByID:
    get:
      description: "Retrieve all config snapshots, identified by its Resource Id,\
        \ ordered by most recently created/modified date. "
      operationId: ResourceConfigSnapshotController_getAllByID_GET.org.onap.ccsdk.cds.blueprintsprocessor.configs.api
      parameters:
      - description: Resource Id associated of the resource configuration snapshots
        example: 1
        in: query
        name: resourceId
        required: true
        schema:
          type: string
      - description: Status of the snapshot being retrieved
        in: query
        name: status
        required: false
        schema:
          type: string
          default: ANY
      responses:
        "200":
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ResourceConfigSnapshot"
          description: OK
      summary: Retrieve all resource configuration snapshots identified by a given
        resource_id
      tags:
      - Resource configuration
  /api/v1/configs/allByType:
    get:
      description: "Retrieve all config snapshots matching a specified Resource Type,\
        \ ordered by most recently created/modified date. "
      operationId: ResourceConfigSnapshotController_getAllByType_GET.org.onap.ccsdk.cds.blueprintsprocessor.configs.api
      parameters:
      - description: Resource Type associated of the resource configuration snapshot
        example: PNF
        in: query
        name: resourceType
        required: true
        schema:
          type: string
      - description: Status of the snapshot being retrieved
        in: query
        name: status
        required: false
        schema:
          type: string
          default: ANY
      responses:
        "200":
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ResourceConfigSnapshot"
          description: OK
      summary: Retrieve all resource configuration snapshots for a given resource
        type
      tags:
      - Resource configuration
  /api/v1/configs/{resourceType}/{resourceId}:
    delete:
      description: "Delete a resource configuration snapshot, identified by its resourceId\
        \ and resourceType, and optionally its status, either RUNNING or CANDIDATE."
      operationId: ResourceConfigSnapshotController_deleteWithResourceIdAndResourceType_DELETE.org.onap.ccsdk.cds.blueprintsprocessor.configs.api_1
      parameters:
      - description: Resource Type associated with the resolution.
        in: path
        name: resourceType
        required: true
        schema:
          type: string
      - description: Resource Id associated with the resolution.
        in: path
        name: resourceId
        required: true
        schema:
          type: string
      responses:
        "200":
          content: {}
          description: OK
      summary: "Delete a resource configuration snapshot identified by resourceId,\
        \ resourceType, status."
      tags:
      - Resource configuration
  /api/v1/configs/{resourceType}/{resourceId}/{status}:
    delete:
      description: "Delete a resource configuration snapshot, identified by its resourceId\
        \ and resourceType, and optionally its status, either RUNNING or CANDIDATE."
      operationId: ResourceConfigSnapshotController_deleteWithResourceIdAndResourceType_DELETE.org.onap.ccsdk.cds.blueprintsprocessor.configs.api
      parameters:
      - description: Resource Type associated with the resolution.
        in: path
        name: resourceType
        required: true
        schema:
          type: string
      - description: Resource Id associated with the resolution.
        in: path
        name: resourceId
        required: true
        schema:
          type: string
      - description: Status of the snapshot being deleted.
        in: path
        name: status
        required: true
        schema:
          type: string
      responses:
        "200":
          content: {}
          description: OK
      summary: "Delete a resource configuration snapshot identified by resourceId,\
        \ resourceType, status."
      tags:
      - Resource configuration
    post:
      description: "Store a resource configuration snapshot, identified by its resourceId\
        \ and resourceType, and optionally its status, either RUNNING or CANDIDATE."
      operationId: ResourceConfigSnapshotController_postWithResourceIdAndResourceType_POST.org.onap.ccsdk.cds.blueprintsprocessor.configs.api
      parameters:
      - description: Resource Type associated with the resolution
        example: PNF
        in: path
        name: resourceType
        required: true
        schema:
          type: string
      - description: Resource Id associated with the resolution
        example: 1
        in: path
        name: resourceId
        required: true
        schema:
          type: string
      - description: Status of the snapshot being retrieved
        in: path
        name: status
        required: true
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              type: string
              example: config_snapshot
        description: Config snapshot to store
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ResourceConfigSnapshot"
          description: OK
      summary: "Store a resource configuration snapshot identified by resourceId,\
        \ resourceType, status"
      tags:
      - Resource configuration
  /api/v1/dictionary:
    post:
      description: Save a resource dictionary by dictionary provided.
      operationId: ResourceDictionaryController_saveResourceDictionary_POST.org.onap.ccsdk.cds.blueprintsprocessor.designer.api
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ResourceDictionary"
        description: Resource dictionary to store
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ResourceDictionary"
          description: OK
      summary: Save a resource dictionary
      tags:
      - Resource Dictionary
  /api/v1/dictionary/by-names:
    post:
      description: Search for a resource dictionary by names provided.
      operationId: ResourceDictionaryController_searchResourceDictionaryByNames_POST.org.onap.ccsdk.cds.blueprintsprocessor.designer.api
      requestBody:
        content:
          application/json:
            schema:
              type: array
              items:
                type: string
        description: List of names
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ResourceDictionary"
          description: OK
      summary: Search for a resource dictionary
      tags:
      - Resource Dictionary
  /api/v1/dictionary/definition:
    post:
      description: Save a resource dictionary by provided resource definition json.
      operationId: ResourceDictionaryController_saveResourceDictionary_1_POST.org.onap.ccsdk.cds.blueprintsprocessor.designer.api
      requestBody:
        content:
          application/json:
            schema:
