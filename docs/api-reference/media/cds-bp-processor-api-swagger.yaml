components:
  schemas:
    ActionIdentifiers:
      type: object
      properties:
        actionName:
          type: string
          description: Name of the workflow to execute.
        blueprintName:
          type: string
          description: Name of the CBA.
        blueprintVersion:
          type: string
          description: Version of the CBA.
        mode:
          type: string
          description: Async processing is only supported for gRPC client.
          enum:
          - sync
          - async
      required:
      - actionName
      - mode
    ArtifactDefinition:
      type: object
      properties:
        deploy_Path:
          type: string
        description:
          type: string
        file:
          type: string
        properties:
          type: object
          additionalProperties:
            $ref: "#/components/schemas/JsonNode"
        repository:
          type: string
        type:
          type: string
      required:
      - file
      - type
    BlueprintModelSearch:
      type: object
      properties:
        artifactDescription:
          type: string
          description: "Artifact Description, usually empty"
        artifactName:
          type: string
          description: "Artifact Name, defined in Metadata"
          example: pnf_netconf
        artifactType:
          type: string
          description: "Artifact Type, usually null"
          example: SDNC_MODEL
        artifactUUId:
          type: string
          description: "Artifact UUID, usually null"
        artifactVersion:
          type: string
          description: "Artifact Version, usually 1.0.0"
          example: 1.0.0
        createdDate:
          type: string
          format: date-time
          description: Datetime of the creation of CBA in CDS
          example: 2020-11-19T10:34:56.000Z
        id:
          type: string
          description: "ID of Blueprint model, is automatically created by CDS"
          example: 658f9a48-7f54-41ba-ae18-c69f26f3dc94
        internalVersion:
          type: integer
          format: int32
          description: "Internal Version of CBA, usually null"
        published:
          type: string
          description: "Artifact Name, defined in Metadata"
          example: pnf_netconf
        tags:
          type: string
          description: "Tags to identify the CBA, defined in Metadata"
          example: test
        updatedBy:
          type: string
          description: "Name of publisher, defined in Metadata"
          example: Deutsche Telekom AG
      required:
      - artifactName
      - artifactVersion
      - createdDate
      - id
      - published
      - tags
      - updatedBy
    BootstrapRequest:
      type: object
      properties:
        loadCBA:
          type: boolean
          description: Specifies if default blueprint models should be loaded
          example: true
        loadModelType:
          type: boolean
          description: Specifies if default model types should be loaded
          example: true
        loadResourceDictionary:
          type: boolean
          description: Specifies if default data dictionaries should be loaded
          example: true
      required:
      - loadCBA
      - loadModelType
      - loadResourceDictionary
    CapabilityAssignment:
      type: object
      properties:
        attributes:
          type: object
          additionalProperties:
            $ref: "#/components/schemas/JsonNode"
        properties:
          type: object
          additionalProperties:
            $ref: "#/components/schemas/JsonNode"
    CommonHeader:
      type: object
      properties:
        originatorId:
          type: string
          description: Identify the system/person triggering the request.
        requestId:
          type: string
          description: Uniquely identify a request.
        subRequestId:
          type: string
