<app-header>
</app-header>
<tour-step-template></tour-step-template>
<div class="new-wrapper">
    <div class="container-fluid main-container">
        <app-packages-header (gettingStarted)="startTour = true"></app-packages-header>
        <main class="container-fluid body-container" id="main-content" tabindex="-1">
            <!--Tour Starter-->
            <div class="panel-wrap packageWizard" [class.open]="startTour">
                <section class="panel" aria-labelledby="welcome-title">
                    <button id="clicker1" class="close" type="button" aria-label="Close" (click)="stopTour()">
                        <img src="assets/img/icon-close.svg" alt="" />
                    </button>
                    <br />
                    <h2 id="welcome-title">Welcome to CDS Designer UI</h2>
                    <p>CDS has new look and new way of delivering a reusable and simplified self-service experience.</p>
                    <!-- <span>Tab through these quick steps to help you get started.</span>
                    <br /> -->
                    <button id="clicker2" class="closeWizard mr-2" type="button" (click)="stopTour()">No Thanks</button>
                    <button type="button" class="startTour float" (click)="start()">Start Tour</button>
                </section>
            </div>
            <!---->
            <div class="row" tourAnchor="allTab">
                <!--Nav Tabs-->
                <div class="col pr-0">
                    <div class="nav nav-tabs " id="nav-tab" role="tablist">
                        <a class="nav-item nav-link" [class.active]="activeTab === 'All'"
                            (click)="selectTab('All')" role="tab" aria-selected="true">All</a>
                        <a class="nav-item nav-link" [class.active]="activeTab === 'Deployed'"
                            (click)="selectTab('Deployed')" role="tab" aria-selected="false">Deployed</a>
                        <a tourAnchor="test3" class="nav-item nav-link" [class.active]="activeTab === 'Under Construction'"
                            (click)="selectTab('Under Construction')" role="tab" aria-selected="false">Under
                            Construction</a>
                        <a class="nav-item nav-link" [class.active]="activeTab === 'Archived'"
                            (click)="selectTab('Archived')" role="tab" aria-selected="false">Archived</a>
                    </div>
                </div>
                <!--Nav Search & Filter-->
                <div class="col search-filter-col">
                    <div class="row">
                        <div class="col-7">
                            <app-packages-search></app-packages-search>
                        </div>
                        <div class="col-5 pl-2" tourAnchor="tagFilter">
                            <app-filter-by-tags class="w-100"></app-filter-by-tags>
                        </div>

                    </div>
                </div>
            </div>
            <app-sort-packages></app-sort-packages>
        </main>
    </div>
    <!-- <div class="copyright text-center w-100 m-auto">Copyright &#64;2020 CDS Designer UI - v1.0.0</div> -->
</div>
